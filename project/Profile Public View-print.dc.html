                <span style="height:44px;padding:0 8px;display:flex;align-items:center;gap:5px;"><span style="font-size:17px;line-height:1;">♡</span>{{ card.likes }}</span>

                <span style="height:44px;padding:0 8px;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;">Share<svg width="16" height="16" viewBox="0 0 24 24" fill="oklch(41.5% 0.006 80)" stroke="oklch(41.5% 0.006 80)" strokeWidth="1" strokeLinejoin="round"><path d="M13.5 4.5v4.2C7 9.3 3.6 13.4 3 19.5c2.4-3.4 5.6-4.9 10.5-5v4.3L21 11.6z"></path></svg></span>

<script type="text/x-dc" data-dc-script data-props="{&quot;totalStacks&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:12,&quot;min&quot;:4,&quot;max&quot;:200,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const h = React.createElement;
    const svg = (kids, filled) => h('svg', { width: 20, height: 20, viewBox: '0 0 24 24', fill: filled ? 'currentColor' : 'none', stroke: filled ? 'none' : 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' }, ...kids);
    const icons = {
      Instagram: svg([h('rect', { key: 1, x: 3.5, y: 3.5, width: 17, height: 17, rx: 5 }), h('circle', { key: 2, cx: 12, cy: 12, r: 4 }), h('circle', { key: 3, cx: 17.2, cy: 6.8, r: 0.6, fill: 'currentColor' })]),

      YouTube: svg([h('rect', { key: 1, x: 2.5, y: 5.5, width: 19, height: 13, rx: 4 }), h('path', { key: 2, d: 'M10.5 9.5v5l4-2.5z', fill: 'currentColor' })]),
    };
    const socials = ['Instagram', 'X', 'TikTok', 'YouTube'].map(n => ({ name: n, url: '#', icon: icons[n] }));
    const sites = [
      { label: 'Field Notes newsletter', domain: 'mayaokafor.substack.com', url: '#' },
      { label: 'Portfolio', domain: 'mayaokafor.studio', url: '#' },
    ];
    const total = this.props.totalStacks ?? 12;
    const stacks = [
      { title: 'Best ramen in Brooklyn, ranked', description: 'Two years of Sunday lunches, distilled.', total: 14, likes: 482, saves: 211, reposts: 38, lines: ['Okiboru — the tsukemen is the move', 'Chuko — go early, no reservations', 'Ramen by Ra — Saturdays only'] },
      { title: 'Books that changed how I design', description: 'Not design books, mostly.', total: 9, likes: 310, saves: 164, reposts: 21, lines: ['The Timeless Way of Building', 'Thinking in Systems', 'Bird by Bird'] },
      { title: 'Tools I actually pay for', description: 'Everything else got cancelled.', total: 11, likes: 228, saves: 97, reposts: 12, lines: ['Things 3 — still the best to-do app', 'Raycast Pro', 'Readwise'] },
