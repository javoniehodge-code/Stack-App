# Local development config for `supabase start`. Only the settings Stack relies
# on are listed; everything else uses the CLI defaults.
project_id = "stack"

[api]
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
port = 54323

# Captures sign-in emails locally: http://127.0.0.1:54324
[local_smtp]
enabled = true
port = 54324

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm"]
enable_signup = true

# Sign-in is by a 6-digit email code (no passwords). One template covers new and returning
# accounts; both must show the code ({{ .Token }}).
[auth.email]
enable_signup = true
enable_confirmations = true
otp_length = 6
otp_expiry = 600
max_frequency = "30s"

[auth.email.template.confirmation]
subject = "Your Stack sign-in code"
content_path = "./supabase/templates/sign-in-code.html"

[auth.email.template.magic_link]
subject = "Your Stack sign-in code"
content_path = "./supabase/templates/sign-in-code.html"
