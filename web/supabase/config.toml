# Local development config for `supabase start`. Only the settings Stack relies
# on are listed; everything else uses the CLI defaults.
project_id = "stack"

[api]
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
port = 54323

# Captures sign-in emails locally: http://127.0.0.1:54324
[local_smtp]
enabled = true
port = 54324

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm"]
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true
otp_length = 6
otp_expiry = 3600

# Emails carry a 6-digit code ({{ .Token }}) that the app asks for: once to
# confirm a new account's email, and when resetting a password.
[auth.email.template.confirmation]
subject = "Confirm your Stack account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Stack password"
content_path = "./supabase/templates/recovery.html"
